specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: PrintNode
providerId: printnode
created: '2026-06-25'
modified: '2026-06-25'
reconciled: true
tags:
- Printing
- Cloud Printing
- Remote Printing
- Print Jobs
- Hardware
- Plans
description: >-
  PrintNode prices by print volume and the number of connected computers,
  across a free Lite tier and three paid Single Account tiers (Essential,
  Standard, Premium) plus two Integrator tiers (Standard, Large) for managing
  child accounts. One print equals one API request regardless of page count.
  Plans are billed monthly or annually, with metered overage per 1,000 prints.
  Standalone server deployments are available on request. The first month is
  free with unlimited usage.
notes: >-
  Representative USD rates as published on the PrintNode pricing page; prices
  are also offered in EUR and GBP. Verify the current tiers and overage rates
  on the pricing page during reconciliation.
sources:
- https://www.printnode.com/en/pricing
- https://www.printnode.com/en/docs/api/curl
