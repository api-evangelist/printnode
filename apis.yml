aid: printnode
url: https://raw.githubusercontent.com/api-evangelist/printnode/refs/heads/main/apis.yml
name: PrintNode
kind: company
description: PrintNode is a cloud and remote printing service that lets web and server
  applications print to any physical printer through a lightweight client installed
  on a remote computer. Its REST API at https://api.printnode.com covers accounts,
  computers, printers, print jobs, scales, child-account/API-key management, and webhooks,
  using HTTP Basic authentication with an API key.
